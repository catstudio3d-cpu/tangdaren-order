<script src="./cloud.js"></script><script src="./qr.js"></script><script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString('zh-TW');
const today=()=>new Date(Date.now()+28800000).toISOString().slice(0,10);
const time=s=>new Date(s).toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',hour12:false});
const categories=['全部餐點','原味燉盅','暖心套餐','廣東腸粉','飯麵主食','私房小菜','家傳甜湯'];
const icons=['◉','♨','▣','◒','▤','❀','◡'];
const path=new URLSearchParams(location.search).get('page')||'/';let table=Number(new URLSearchParams(location.search).get('table'))||0;
let state={menu:[],role:null,category:'全部餐點',query:'',cart:[],table:null,rows:[],selected:1,report:null,day:today(),online:true,drawer:false};
let busy=false,checkoutSnapshot=null,pendingOrder=null,polling=false;
function newId(){const b=new Uint8Array(16);crypto.getRandomValues(b);return Array.from(b,x=>x.toString(16).padStart(2,'0')).join('')}
try{state.cart=JSON.parse(localStorage.getItem('cart-'+table)||'[]');pendingOrder=JSON.parse(localStorage.getItem('pending-'+table)||'null')}catch{}
function persist(){localStorage.setItem('cart-'+table,JSON.stringify(state.cart))}
async function api(url,body){const r=await cloudFetch(url,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Object.assign(new Error(data.error||'連線失敗'),{status:r.status});return data}
function toast(s){const t=$('#toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',4000)}
function connection(){return '<span class="connection '+(!state.online?'offline':'')+'">'+(state.online?'每 2.5 秒同步':'連線中斷・重新連線中')+'</span>'}
function header(){return '<header class="app-header"><a class="brand" href="/"><span class="seal">湯</span><div><strong>湯達人</strong><small>原味燉盅 · 用心慢燉</small></div></a><div class="header-right">'+(path==='/'?'<span class="pill">同桌一起點・好湯一起享</span><span class="table-badge">'+(table?'第 '+String(table).padStart(2,'0')+' 桌':'歡迎入座')+'</span>':'<span class="subtle">門市營運管理</span>'+connection()+'<button class="link-button" data-action="logout">登出</button>')+'</div></header>'}

async function photoData(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>15*1024*1024)throw Error('請選擇 15MB 以內的 JPG、PNG 或 WebP 圖片。');const bitmap=await createImageBitmap(file);const ratio=Math.min(1,1000/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*ratio));canvas.height=Math.max(1,Math.round(bitmap.height*ratio));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();let data=canvas.toDataURL('image/jpeg',.8);if(data.length>700000)data=canvas.toDataURL('image/jpeg',.5);if(data.length>700000)throw Error('圖片過大，請選擇較小的照片。');return data;}

  let p=document.getElementById('cp-controls');if(!p){p=document.createElement('section');p.id='cp-controls';p.className='cp-controls';p.innerHTML='<div class="actions"><strong>列印設定</strong>'+(navigator.usb?'<button class="btn small secondary" id="cp-connect">連接 USB 印表機</button><label><input type="checkbox" id="cp-auto">USB 自動列印</label><label><input type="checkbox" id="cp-narrow">58 mm 紙</label><label><input type="checkbox" id="cp-cut">自動切紙</label>':'<span>此瀏覽器使用「列印／儲存 PDF」功能。</span>')+(state.role==='admin'?'<button class="btn small secondary" id="cp-history">訂單查詢／重印</button>':'')+'<span id="cp-last"></span></div><div class="cp-status" id="cp-status"></div><small>USB 自動列印需先連接並保持本頁開啟；每筆工作由一台裝置接收。系統列印需手動確認。</small>';main.prepend(p);
   p.querySelector('#cp-connect')?.addEventListener('click',()=>connect().catch(e=>message(e.message)));p.querySelector('#cp-auto')?.addEventListener('change',e=>{if(e.target.checked&&!['/kitchen','/cashier'].includes(path)){e.target.checked=false;message('請在廚房出餐或前台結帳頁啟用');return;}if(e.target.checked&&!device){e.target.checked=false;message('請先按「連接 USB 印表機」');return;}pref.auto=e.target.checked;save();poll()});
   for(const [id,key,def] of [['cp-narrow','narrow',false],['cp-cut','cut',true]]){const b=p.querySelector('#'+id);if(b){b.checked=pref[key]??def;b.onchange=()=>{pref[key]=b.checked;save()}}}p.querySelector('#cp-history')?.addEventListener('click',history);
  }
  const auto=p.querySelector('#cp-auto');if(auto)auto.checked=!!pref.auto;const stat=p.querySelector('#cp-status');if(stat.textContent!==lastMessage)stat.textContent=lastMessage;
  if(lastBill&&kind()==='receipt'){const slot=p.querySelector('#cp-last');if(!slot.firstChild){const b=document.createElement('button');b.className='btn small secondary';b.textContent='列印最近結帳清單';b.onclick=()=>preview(lastBill,'receipt');slot.appendChild(b)}}
  if(path==='/kitchen'){const bills=grouped();document.querySelectorAll('.kitchen-grid>.ticket').forEach((card,i)=>{if(card.querySelector('[data-cp-ticket]')||!bills[i])return;const b=document.createElement('button');b.dataset.cpTicket='1';b.className='btn small secondary';b.textContent='列印點餐單';const id=bills[i].id;b.onclick=()=>preview(id,'kitchen');card.querySelector('.ticket-head').appendChild(b)})}
  for(const pay of document.querySelectorAll('[data-checkout]')){if(pay.parentElement.querySelector('[data-cp-bill]'))continue;const b=document.createElement('button');b.dataset.cpBill='1';b.className='btn secondary';b.textContent='列印消費明細';b.onclick=()=>preview(pay.dataset.checkout,'receipt');pay.parentElement.appendChild(b)}
 }
 style();let queued=false;new MutationObserver(()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;decorate()})}).observe(document.getElementById('app'),{childList:true,subtree:true});setInterval(poll,1500);setInterval(decorate,1500);decorate();
 navigator.usb?.addEventListener('disconnect',e=>{if(e.device===device){device=null;pref.auto=false;save();message('USB 已中斷，請重新連接；若已有部分紙本請確認後補印。')}});
})();
