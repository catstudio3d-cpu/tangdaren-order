<script src="./cloud.js"></script><script src="./qr.js"></script><script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString('zh-TW');
const today=()=>new Date(Date.now()+28800000).toISOString().slice(0,10);
const time=s=>new Date(s).toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',hour12:false});
const categories=['全部餐點','原味燉盅','暖心套餐','廣東腸粉','飯麵主食','私房小菜','家傳甜湯'];
const icons=['◉','♨','▣','◒','▤','❀','◡'];
const path=new URLSearchParams(location.search).get('page')||'/';let table=Number(new URLSearchParams(location.search).get('table'))||0;
let state={menu:[],role:null,category:'全部餐點',query:'',cart:[],table:null,rows:[],selected:1,report:null,day:today(),online:true,drawer:false};
let busy=false,checkoutSnapshot=null,pendingOrder=null,polling=false;
function newId(){const b=new Uint8Array(16);crypto.getRandomValues(b);return Array.from(b,x=>x.toString(16).padStart(2,'0')).join('')}
try{state.cart=JSON.parse(localStorage.getItem('cart-'+table)||'[]');pendingOrder=JSON.parse(localStorage.getItem('pending-'+table)||'null')}catch{}
function persist(){localStorage.setItem('cart-'+table,JSON.stringify(state.cart))}
async function api(url,body){const r=await cloudFetch(url,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Object.assign(new Error(data.error||'連線失敗'),{status:r.status});return data}
function toast(s){const t=$('#toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',4000)}
function connection(){return '<span class="connection '+(!state.online?'offline':'')+'">'+(state.online?'每 2.5 秒同步':'連線中斷・重新連線中')+'</span>'}

function cashier(){const bills=grouped(),selected=bills.find(b=>b.table_no===state.selected);const pending=state.rows.filter(x=>!x.served).reduce((a,x)=>a+x.qty,0);return pageTop('前台結帳','掌握桌況、出餐進度與收款，一目了然。','<span class="pill">'+today().replaceAll('-',' / ')+'</span>')+'<div class="stats"><div class="stat"><span>目前待收款</span><strong>'+money(bills.reduce((a,b)=>a+b.total,0))+'</strong><small>僅含未結帳帳單</small></div><div class="stat"><span>用餐桌數</span><strong>'+bills.length+' <small>/ 10 桌</small></strong><small>多人點餐合併帳單</small></div><div class="stat"><span>待出餐份數</span><strong>'+pending+'</strong><small>廚房勾選後同步更新</small></div><div class="stat"><span>已出齊桌數</span><strong>'+bills.length+'</strong><small>可確認收款結帳</small></div></div><div class="section-heading"><h2>門市桌況</h2><span class="subtle">點選桌號查看帳單</span></div><div class="tables-grid">'+Array.from({length:10},(_,i)=>{const b=bills.find(x=>x.table_no===i+1);return '<button class="table-card '+(b?'open ':'')+(state.selected===i+1?'selected':'')+'" data-table="'+(i+1)+'"><div class="row"><span class="num">'+String(i+1).padStart(2,'0')+'</span><span class="status '+(!b||b.lines.every(x=>x.served)?'done':'')+'">'+(!b?'空桌':b.lines.every(x=>x.served)?'已出齊':'備餐中')+'</span></div><span class="subtle">'+(b?b.lines.reduce((a,x)=>a+x.qty,0)+' 份餐點':'等待入座')+'</span><strong>'+money(b?.total)+'</strong></button>'}).join('')+'</div><section class="panel">'+(selected?'<div class="row wrap"><h2>第 '+String(selected.table_no).padStart(2,'0')+' 桌・消費明細</h2><span class="subtle">'+time(selected.opened_at)+' 開單</span></div><div class="table-wrap"><table><thead><tr><th>餐點</th><th>數量</th><th>小計</th><th>出餐狀態</th></tr></thead><tbody>'+selected.lines.map(x=>'<tr><td>'+esc(x.name)+(x.note?'<div class="note">'+esc(x.note)+'</div>':'')+'</td><td>'+x.qty+'</td><td>'+money(x.price*x.qty)+'</td><td><span class="status '+(x.served?'done':'')+'">'+(x.served?'已出餐':'準備中')+'</span></td></tr>').join('')+'</tbody></table></div><div class="row wrap" style="margin-top:22px"><div><span class="subtle">應收總額</span><div class="price" style="font-size:29px">'+money(selected.total)+'</div></div><button class="btn" data-checkout="'+selected.id+'" '>'&#x78BA;&#x8A8D;&#x6536;&#x6B3E;&#x7D50;&#x5E33;'</button></div>':'<div class="empty"><h3>第 '+String(state.selected).padStart(2,'0')+' 桌目前為空桌</h3>掃描桌牌即可開始點餐，無需手動開桌。</div>')+'</section>'}
function qrcodes(){const cards=Array.from({length:10},(_,i)=>({key:'table-'+(i+1),title:'第 '+String(i+1).padStart(2,'0')+' 桌',href:'/?table='+(i+1)})).concat([{key:'kitchen',title:'廚房出餐',href:'/kitchen'},{key:'cashier',title:'前台結帳',href:'/cashier'}]);return pageTop('桌牌 QR Code','桌牌會使用目前 GitHub Pages 網址，列印前請確認網址。','<button class="btn" data-action="print">列印全部桌牌</button>')+'<div class="qr-grid">'+cards.map(c=>{const href=siteHref(c.href);const image='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(qrSvg(href));return '<article class="qr-card"><h2>'+c.title+'</h2><img class="qrcode" src="'+image+'" alt="'+c.title+' QR Code"><p>湯達人・同桌一起點</p><div class="print-only">'+esc(href)+'</div><div class="actions"><a class="btn small secondary" href="'+image+'" download="'+c.key+'.svg">下載 SVG</a><a class="btn small ghost" href="'+href+'" target="_blank" rel="noopener">開啟入口</a></div></article>';}).join('')+'</div>';}
function reports(){const r=state.report;return pageTop('每日營收記帳','以台灣日期歸帳；結帳收款後，營收自動入帳。','<div class="row"><input type="date" id="report-day" aria-label="營收日期" value="'+state.day+'"><a class="btn secondary" href="/api/export?day='+state.day+'">匯出 CSV</a></div>')+(r?'<div class="stats"><div class="stat"><span>本日實收營收</span><strong>'+money(r.revenue)+'</strong><small>已結帳 '+r.bills.length+' 筆</small></div><div class="stat"><span>本日支出</span><strong>'+money(r.expense)+'</strong><small>已登錄 '+r.expenses.length+' 筆</small></div><div class="stat"><span>營收扣除支出</span><strong>'+money(r.revenue-r.expense)+'</strong><small>非正式會計損益</small></div><div class="stat"><span>平均每筆消費</span><strong>'+money(r.bills.length?Math.round(r.revenue/r.bills.length):0)+'</strong><small>實收營收 ÷ 結帳筆數</small></div></div><div class="report-cols"><section class="panel" style="margin-top:0"><h2>收款紀錄</h2><div class="table-wrap"><table><thead><tr><th>時間／帳單</th><th>桌號</th><th>付款</th><th>金額</th></tr></thead><tbody>'+r.bills.map(b=>'<tr><td>'+time(b.paid_at)+'<div class="subtle">'+b.id+'</div></td><td>'+b.table_no+'</td><td>'+esc(b.payment)+'</td><td>'+money(b.total)+'</td></tr>').join('')+'</tbody></table></div>'+(!r.bills.length?'<div class="empty">本日尚無結帳紀錄</div>':'')+'</section><section class="panel" style="margin-top:0"><h2>餐點銷售排行</h2>'+r.sales.map(s=>'<div class="bar-row"><div class="row"><span>'+esc(s.name)+'</span><b>'+s.quantity+' 份</b></div><div class="bar-track"><div class="bar" style="width:'+Math.round(s.quantity/Math.max(...r.sales.map(x=>x.quantity),1)*100)+'%"></div></div></div>').join('')+(!r.sales.length?'<div class="empty">尚無餐點銷售紀錄</div>':'')+'</section></div>':'<div class="loading">讀取營收資料中…</div>')+'<section class="panel"><h2>登錄日常支出</h2><form id="expense-form" class="form-grid"><div><label for="expense-category">支出分類</label><select id="expense-category">'+['食材','人事','租金','水電','其他'].map(x=>'<option>'+x+'</option>').join('')+'</select></div><div><label for="expense-amount">金額（元）</label><input id="expense-amount" type="number" required min="1" max="9999999" step="1" placeholder="0"></div><div><label for="expense-note">備註</label><input id="expense-note" maxlength="200" placeholder="例如：今日蔬菜進貨"></div><button class="btn" type="submit">新增支出</button></form>'+(r?.expenses.length?'<div class="table-wrap" style="margin-top:20px"><table><thead><tr><th>分類</th><th>備註</th><th>金額</th></tr></thead><tbody>'+r.expenses.map(e=>'<tr><td>'+esc(e.category)+'</td><td>'+esc(e.note)+'</td><td>'+money(e.amount)+'</td></tr>').join('')+'</tbody></table></div>':'')+'</section>'}
function imageSource(p){return p.image?.startsWith('data:')||p.image?.startsWith('https://')?p.image:'https://tb-static.uber.com/prod/image-proc/processed_images/'+p.image+'.jpeg'}
function menuFields(p={}){return '<div class="field"><label>餐點名稱</label><input name="name" aria-label="餐點名稱" maxlength="80" value="'+esc(p.name||'')+'" required></div><div class="field"><label>分類</label><select name="category">'+categories.slice(1).map(c=>'<option '+(c===p.category?'selected':'')+'>'+c+'</option>').join('')+'</select></div><div class="field"><label>價格（元）</label><input name="price" aria-label="價格" type="number" min="0" max="99999" step="1" value="'+(p.price??'')+'" required></div><div class="field"><label>餐點說明</label><textarea name="description" maxlength="500">'+esc(p.description||'')+'</textarea></div><div class="field"><label>圖片網址（HTTPS）</label><input name="image" aria-label="圖片網址" value="'+esc(p.image||'')+'" placeholder="可貼上網址，或在下方上傳照片"></div><div class="field"><label>上傳餐點照片</label><input name="photo" type="file" accept="image/jpeg,image/png,image/webp"><small class="subtle">選擇照片會自動縮圖儲存；上傳照片優先於網址。</small></div>'+(p.image?'<img src="'+esc(imageSource(p))+'" alt="'+esc(p.name)+'" style="width:160px;height:120px;object-fit:cover;border-radius:10px">':'')+'<div class="field"><label><input type="checkbox" name="available" '+(p.available!==false?'checked':'')+'> 供應中</label></div><button class="btn" type="submit">'+(p.id?'儲存修改':'新增餐點')+'</button>'}
function settings(){return pageTop('餐點管理','自行新增餐點、照片與價格；已送出的訂單保留原始名稱與價格。')+'<section class="panel" style="margin-top:0"><h2>新增餐點</h2><form id="menu-create-form">'+menuFields()+'</form></section><section class="panel"><h2>現有餐點（'+state.menu.length+' 項）</h2>'+state.menu.map(p=>'<details style="border-bottom:1px solid var(--line);padding:16px 0"><summary style="cursor:pointer;font-size:18px">'+esc(p.name)+' · '+money(p.price)+' · '+(p.available?'供應中':'已停售')+'</summary><form data-menu-edit="'+esc(p.id)+'">'+menuFields(p)+'</form></details>').join('')+'</section>'}
async function photoData(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>15*1024*1024)throw Error('請選擇 15MB 以內的 JPG、PNG 或 WebP 圖片。');const bitmap=await createImageBitmap(file);const ratio=Math.min(1,1000/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*ratio));canvas.height=Math.max(1,Math.round(bitmap.height*ratio));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();let data=canvas.toDataURL('image/jpeg',.8);if(data.length>700000)data=canvas.toDataURL('image/jpeg',.5);if(data.length>700000)throw Error('圖片過大，請選擇較小的照片。');return data;}

async function refresh(){if(polling)return;polling=true;try{if(path==='/'){if(table){const next=await api('/api/table?table='+table);const changed=JSON.stringify(next)!==JSON.stringify(state.table);if(state.table&&next.generation!==state.table.generation){toast('本桌已結帳。新點餐將建立新帳單。');pendingOrder=null;localStorage.removeItem('pending-'+table)}state.table=next;if(changed&&$('#cart'))$('#cart').innerHTML=cartContent();}}else if(state.role){if(path==='/kitchen'||path==='/cashier'){const r=await api('/api/board');if(JSON.stringify(r.rows)!==JSON.stringify(state.rows)){state.rows=r.rows;if(!$('#modal').innerHTML)render();}}else if(path==='/reports'){const r=await api('/api/report?day='+state.day);if(JSON.stringify(r)!==JSON.stringify(state.report)){state.report=r;if(!$('#expense-amount')?.value)render()}}}if(!state.online){state.online=true;render();}}catch(e){if(e.status===401&&path!=='/'){state.role=null;render()}else if(state.online){state.online=false;render()}}finally{polling=false}}
async function load(){try{const r=await api('/api/menu');state.menu=r.menu;state.role=r.role;state.cloudReady=r.ready!==false;if(path!=='/'&&state.role&&state.role!=='admin'&&path!==(state.role==='kitchen'?'/kitchen':'/cashier')){location.replace(siteHref(state.role==='kitchen'?'/kitchen':'/cashier'));return}state.cart=state.cart.filter(x=>r.menu.some(p=>p.id===x.id)&&Number.isInteger(x.qty)&&x.qty>0&&x.qty<=20);if(table<1||table>10)table=0;if(path==='/'&&table)state.table=await api('/api/table?table='+table);if(state.role&&(path==='/cashier'||path==='/kitchen'))state.rows=(await api('/api/board')).rows;if(state.role==='admin'&&path==='/reports')state.report=await api('/api/report?day='+state.day);state.online=true;render();}catch(e){$('#app').innerHTML='<div class="login-wrap"><h1>暫時無法連線</h1><p>'+esc(e.message)+'</p><button class="btn" data-action="reload">重新連線</button></div>'}}
function modal(content){$('#modal').innerHTML='<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true">'+content+'</section></div>';$('#modal input, #modal textarea, #modal button')?.focus()}
function closeModal(){$('#modal').innerHTML='';checkoutSnapshot=null}
async function submitOrder(){if(busy||!table||!state.cart.length)return;busy=true;renderGuest();try{if(!pendingOrder){pendingOrder={table,generation:state.table.generation,requestId:newId(),items:state.cart.map(x=>({id:x.id,qty:x.qty,note:x.note||'',price:x.price}))};localStorage.setItem('pending-'+table,JSON.stringify(pendingOrder))}await api('/api/order',pendingOrder);state.cart=[];persist();pendingOrder=null;localStorage.removeItem('pending-'+table);state.drawer=false;toast('點餐已送出！廚房正在為您準備。');await refresh()}catch(e){toast(e.message);if(e.status===409){pendingOrder=null;localStorage.removeItem('pending-'+table);const r=await api('/api/menu');state.menu=r.menu;state.cart=state.cart.map(x=>({...x,price:r.menu.find(p=>p.id===x.id)?.price??x.price}));persist();await refresh()}}finally{busy=false;renderGuest()}}
document.addEventListener('click',async e=>{const b=e.target.closest('button,a');if(!b)return;try{if(b.dataset.category){state.category=b.dataset.category;renderGuest()}if(b.dataset.add){if(!table){toast('請先選擇桌號，或掃描桌牌 QR Code。');return}if(pendingOrder){toast('上次送單尚待確認，請先按送出重試。');return}const p=state.menu.find(x=>x.id===b.dataset.add);const found=state.cart.find(x=>x.id===p.id&&!x.note);if(found){if(found.qty>=20){toast('單項上限 20 份');return}found.qty++}else state.cart.push({...p,qty:1,note:''});persist();renderGuest();toast('已加入 '+p.name)}if(b.dataset.qty!==undefined){if(pendingOrder){toast('請先確認上次送單結果。');return}const x=state.cart[Number(b.dataset.qty)];x.qty+=Number(b.dataset.delta);if(x.qty>20)x.qty=20;state.cart=state.cart.filter(x=>x.qty>0);persist();renderGuest()}if(b.dataset.note!==undefined){if(pendingOrder){toast('請先確認上次送單結果。');return}const i=Number(b.dataset.note);modal('<h2>餐點備註</h2><p>'+esc(state.cart[i].name)+'</p><textarea id="item-note" rows="3" maxlength="200" placeholder="例如：不要蔥、醬料另外放">'+esc(state.cart[i].note)+'</textarea><div class="modal-actions"><button class="btn secondary" data-action="close">取消</button><button class="btn" data-save-note="'+i+'">儲存備註</button></div>')}if(b.dataset.saveNote!==undefined){state.cart[Number(b.dataset.saveNote)].note=$('#item-note').value;persist();closeModal();renderGuest()}if(b.dataset.table){state.selected=Number(b.dataset.table);render()}if(b.dataset.checkout){const bill=grouped().find(x=>x.id===b.dataset.checkout);checkoutSnapshot={billId:bill.id,expectedTotal:bill.total,expectedCount:bill.lines.length};modal('<h2>第 '+bill.table_no+' 桌・確認收款</h2><p>應收 <strong class="price">'+money(bill.total)+'</strong></p><div class="field"><label for="payment">付款方式（記錄用）</label><select id="payment"><option>現金</option><option>刷卡</option><option>行動支付</option></select></div><div class="field"><label for="received">實收金額</label><input id="received" type="number" min="'+bill.total+'" step="1" value="'+bill.total+'"></div><p class="subtle">請確認已實際收到款項。完成後會結束本桌帳單，並計入每日營收。</p><div class="modal-actions"><button class="btn secondary" data-action="close">返回確認</button><button class="btn" data-action="pay">已收款，完成結帳</button></div>')}switch(b.dataset.action){case 'submit':await submitOrder();break;case 'drawer':state.drawer=!state.drawer;renderGuest();break;case 'close':closeModal();break;case 'print':window.print();break;case 'reload':await load();break;case 'logout':await api('/api/logout',{});state.role=null;render();break;case 'pay':b.disabled=true;try{const r=await api('/api/checkout',{...checkoutSnapshot,payment:$('#payment').value,received:Number($('#received').value)});closeModal();toast('結帳完成，找零 '+money(r.change));await refresh();render()}catch(err){closeModal();await refresh();render();throw err}break}}catch(err){toast(err.message)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;$('#menu-grid').innerHTML=foodCards()}});
document.addEventListener('change',async e=>{try{if(e.target.id==='table-choice'&&e.target.value)location.href=siteHref('/?table='+e.target.value);if(e.target.dataset.serve){const c=e.target;c.disabled=true;await api('/api/serve',{id:c.dataset.serve,served:c.checked});await refresh();render()}if(e.target.id==='report-day'){state.day=e.target.value;state.report=await api('/api/report?day='+state.day);render()}}catch(err){toast(err.message);render()}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,btn=f.querySelector('button[type=submit]');if(btn)btn.disabled=true;try{if(f.id==='login-form'){await api('/api/login',{role:path==='/kitchen'?'kitchen':'cashier',username:$('#username').value.trim(),pin:$('#pin').value});await load()}if(f.id==='expense-form'){await api('/api/expense',{day:state.day,category:$('#expense-category').value,amount:Number($('#expense-amount').value),note:$('#expense-note').value});state.report=await api('/api/report?day='+state.day);render();toast('支出已記帳')}if(f.id==='menu-create-form'||f.dataset.menuEdit){const file=f.elements.photo.files[0];const image=file?await photoData(file):f.elements.image.value.trim();await api('/api/menu-save',{id:f.dataset.menuEdit||undefined,name:f.elements.name.value.trim(),category:f.elements.category.value,description:f.elements.description.value,image,price:Number(f.elements.price.value),available:f.elements.available.checked});state.menu=(await api('/api/menu')).menu;render();toast('餐點已儲存，顧客重新整理即可看到')}if(f.dataset.menuForm){await api('/api/menu-update',{id:f.dataset.menuForm,price:Number(f.elements.price.value),available:f.elements.available.checked});state.menu=(await api('/api/menu')).menu;toast('菜單已更新')}}catch(err){if(f.id==='login-form')$('#login-error').innerHTML='<p class="error">'+esc(err.message)+'</p>';else toast(err.message)}finally{if(btn)btn.disabled=false}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
load();setInterval(refresh,2500);
</script></body></html>
